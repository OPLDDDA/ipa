name: Build WallpaperStudio IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen & Generate Project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build App without signing
        run: |
          xcodebuild -project WallpaperStudio.xcodeproj \
            -scheme WallpaperStudio \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=$RUNNER_TEMP/build

      - name: Package into IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r $RUNNER_TEMP/build/*.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r WallpaperStudio.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperStudio-ipa
          path: ${{ runner.temp }}/WallpaperStudio.ipa
